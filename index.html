<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=0, initial-scale=1.0">
    <title>Game Suit</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #c9d9f2;
        }
        .box {
            background: #074813d8;
            color: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(1, 2, 1, 0.973);
        }
        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Game Suit</h2>
        <p>Pilih jenis suit:</p>
        <button onclick="mainBatuGuntingKertas()">✊ ✌️ ✋<br>Batu Gunting Kertas</button><br>
        <button onclick="mainGajahOrangSemut()">🐘 👧🏼 🐜<br> Gajah Orang Semut</button><br>
        <button onclick="mainSuitJari()">👍🏼 ☝🏼 🤙🏼<br>Suit Jari</button>
        <h3 id="hasil">Hasil Suit</h3>
    </div>

    <script>
        function mainBatuGuntingKertas (){
            let user = prompt ("Pilih Batu✊, Gunting✌️, atau Kertas✋");
            if(!user) return;
            let comp = ["Batu✊", "Gunting✌️", "Kertas✋"][
                Math.floor(Math.random()*3)];
                let hasil = "";
            if (user == comp){
                hasil = "🫱🏽‍🫲🏽 Seri";
            }else if (
                (user == "Batu✊" && comp == "Gunting✌️") ||
                (user == "Gunting✌️" && comp == "Kertas✋") ||
                (user == "Kertas✋" && comp == "Batu✊")
            ) {
                hasil = " 🏆🤩 Yeay, Kamu Menang";
            } else {
                hasil = "🥲 yahh Kamu Kalah";
            }
            document.getElementById("hasil").innerHTML =
            "Kamu: " + user + "<br>Komputer: " + comp + "<br> " + hasil;
    }
        
        function mainGajahOrangSemut() {
            let user = prompt("Pilih Gajah🐘, Orang👧🏼, atau Semut🐜");
            if (!user) return;
            let comp = ["Gajah🐘", "Orang👧🏼", "Semut🐜"][
                Math.floor(Math.random() * 3)];
                let hasil = "";
            if (user == comp) {
                hasil = "🫱🏽‍🫲🏽 Seri";
            }else if (
                (user == "Gajah🐘" && comp == "Orang👧🏼") ||
                (user == "Orang👧🏼" && comp == "Semut🐜") ||
                (user == "Semut🐜" && comp == "Gajah🐘")
            ) {
                hasil = "🏆🤗 Wahh Kamu Menang";
            }else {
                hasil = "🥲 Yahh Kamu Kalah";
            }

            document.getElementById("hasil").innerHTML =
            "Kamu: " + user + "<br>Komputer: " + comp + "<br> " + hasil;
    }

        function mainSuitJari() {
            let user = prompt("Pilih Jempol👍🏼, Telunjuk☝🏼, atau Kelingking🤙🏼");
            if (!user) return;
            let comp = ["Jempol👍🏼", "Telunjuk☝🏼", "Kelingking🤙🏼"][
                Math.floor(Math.random() * 3)];
                let hasil = "";
            if (user == comp) {
                hasil = "🫱🏽‍🫲🏽 Seri!";
            }else if (
                (user == "Jempol👍🏼" && comp == "Kelingking🤙🏼") ||
                (user == "Kelingking🤙🏼" && comp == "Telunjuk☝🏼") ||
                (user == "Telunjuk☝🏼" && comp == "Jempol👍🏼")
            ) {
                hasil = "🏆😁yeayy Kamu Menang";
            }else {
                hasil = "🥲 upss Kamu Kalah";
            }

            document.getElementById("hasil").innerHTML =
            "Kamu: " + user + "<br>Komputer: " + comp + "<br>  " + hasil;
    }
    </script>
</body>
</html>
